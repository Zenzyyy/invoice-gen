# Copy to config.toml and fill in. config.toml is git-ignored, so your
# bank details never end up in the repo.

currency_symbol = "£"

[sender]
brand = "Your Brand"
tagline = "Video Editing"
name = "Your Name"
email = "you@example.com"
website = "example.com"

[bank]
name = "Your Bank"
account_name = "Your Name"
