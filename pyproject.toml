[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-gen"
version = "0.1.0"
description = "Clean, branded invoices as PNG or PDF from the command line."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jinja2>=3.1", "playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
invoice-gen = "invoice_gen.cli:main"

[tool.setuptools.packages.find]
include = ["invoice_gen*"]

[tool.setuptools.package-data]
invoice_gen = ["templates/*.html"]
